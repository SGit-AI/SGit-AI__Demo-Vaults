<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo Vaults — sgit.ai</title>
<meta name="description" content="Read-only sgit demo vaults: the catalogue itself is a vault app, decrypted in your browser with a published read key, served from this static host.">
<style>
  :root{ --paper:#0e1116; --panel:#161b23; --line:#242c38; --ink:#dce3ec; --dim:#8b96a5; --gold:#d8b26a; }
  *{ box-sizing:border-box }
  html,body{ height:100% }
  body{ margin:0; background:var(--paper); color:var(--ink); display:flex; flex-direction:column;
        font-family:ui-sans-serif, system-ui, sans-serif }
  .bar{ display:flex; align-items:center; gap:.8rem; padding:.65rem 1rem; border-bottom:1px solid var(--line);
        font-size:.8rem; color:var(--dim); flex-wrap:wrap }
  .bar b{ color:var(--gold); font-weight:600 }
  .bar code{ font-family:ui-monospace,Menlo,Consolas,monospace; font-size:.7rem; color:var(--ink);
             overflow-wrap:anywhere }
  .bar a{ color:var(--gold); text-decoration:none; margin-left:auto }
  #embed{ flex:1; display:flex; min-height:0 }
  .sgv-embed-frame{ flex:1; width:100%; border:0 }
  .sgv-embed-loading{ padding:2rem; color:var(--dim); font-size:.9rem }
  noscript{ display:block; padding:2rem; color:var(--ink) }
  /* Overlay for opening a catalogued vault in this page */
  #overlay{ position:fixed; inset:0; background:rgba(6,8,11,.86); display:none;
            flex-direction:column; z-index:50 }
  #overlay.on{ display:flex }
  #ovbar{ display:flex; align-items:center; gap:.8rem; padding:.6rem 1rem;
          border-bottom:1px solid var(--line); font-size:.8rem; color:var(--dim);
          background:var(--paper) }
  #ovbar b{ color:var(--gold) }
  #ovclose{ margin-left:auto; font:inherit; font-size:.78rem; cursor:pointer;
            background:transparent; color:var(--ink); border:1px solid var(--line);
            border-radius:8px; padding:.35rem .75rem }
  #ovclose:hover{ border-color:var(--gold); color:var(--gold) }
  #ovbody{ flex:1; display:flex; min-height:0; background:var(--paper) }
</style>
</head>
<body>
  <div class="bar">
    <span><b>demos.sgit.ai</b> — this page holds no content: it fetches ciphertext from
    <code>send.sgraph.ai</code> and decrypts it in your browser with the published read key
    (<code>vault 2a8d3n2z</code>).</span>
    <a href="https://sgit.ai" rel="noopener">sgit.ai</a>
  </div>
  <div id="embed"></div>
  <div id="overlay">
    <div id="ovbar">
      <span>opening vault <b id="ovid"></b> — ciphertext from <code id="ovep"></code>,
      decrypted in this browser with its published read key</span>
      <button id="ovclose" type="button">✕ close</button>
    </div>
    <div id="ovbody"></div>
  </div>
  <noscript>This page decrypts an encrypted vault in your browser and needs JavaScript.
  The raw encrypted objects are under /api/vault/read/2a8d3n2z/ — the read key is
  published in this page's source.</noscript>
  <script src="vault-embed.js"></script>
  <script>
    // The published triple. Ciphertext is fetched from the SG/API host over CORS and
    // decrypted here in the browser — this page holds no vault content of its own.
    //
    // NOT location.origin: this site is served from a repo subpath
    // (sgit-ai.github.io/SGit-AI__Demo-Vaults/), and the embed host builds read URLs
    // as <endpoint>/api/vault/read/... — from the bare origin those resolve above the
    // site root and 404. CI also mirrors the encrypted tree into this site (see
    // /api/vault/read/<vault-id>/), which is the static-hosting demonstration and an
    // offline/air-gap copy; to open the vault from that mirror instead, the endpoint
    // must include the subpath: location.origin + location.pathname.replace(/\/$/,'').
    SGVaultEmbed.mount(document.getElementById('embed'), {
      endpoint: 'https://send.sgraph.ai',
      vault_id: '2a8d3n2z',
      read_key: 'e6136dab44fecf12b440d6f827419fcb5d51e244576116336c5bef0c42adaa1a',
      entry: 'index.html',
      title: 'Demo Vaults catalogue'
    });

    // Open-a-catalogued-vault-in-this-page. The catalogue app runs in a sandboxed,
    // opaque-origin frame and cannot mount an embed itself, so it asks this page to do
    // it and we ack. No ack (SG/App, the vault browser, a raw file) means the app falls
    // back to opening the official read-only UI in a new tab — see demo-vault/index.html.
    (function () {
      var ov = document.getElementById('overlay'), body = document.getElementById('ovbody');
      var idEl = document.getElementById('ovid'), epEl = document.getElementById('ovep');
      function close() { ov.classList.remove('on'); body.innerHTML = ''; }
      document.getElementById('ovclose').addEventListener('click', close);
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && ov.classList.contains('on')) close();
      });
      window.addEventListener('message', function (ev) {
        var m = ev.data;
        if (!m || m.sgvCat !== 1 || !m.open) return;
        var v = m.open;
        if (!v.vault_id || !v.read_key || !v.endpoint) return;
        // Ack first: the app waits ~1.2s and opens a new tab if nobody answers.
        try { ev.source.postMessage({ sgvCat: 1, openAck: 1 }, '*'); } catch (e) {}
        idEl.textContent = v.vault_id;
        epEl.textContent = v.endpoint;
        body.innerHTML = '';
        ov.classList.add('on');
        SGVaultEmbed.mount(body, {
          endpoint: v.endpoint, vault_id: v.vault_id,
          read_key: v.read_key, title: v.title || ('vault ' + v.vault_id)
        }).catch(function (err) {
          body.innerHTML = '<div class="sgv-embed-loading">Could not open ' +
            v.vault_id + ': ' + (err && err.message || err) + '</div>';
        });
      });
    }());
  </script>
</body>
</html>
